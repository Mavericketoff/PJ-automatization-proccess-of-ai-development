[tool.poetry]
name = "PJ-automatization-proccess-of-ai-development"
version = "0.1.0"
description = ""
authors = ["Mavericketoff <danylalebedev@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.3"
scikit-learn = "^1.3"
dvc = "^3.67"
pandera = "^0.36"
matplotlib = "^3.8"
numpy = "^1.25"
joblib = "^1.3"
mlflow = "^2.8"
fastapi = "^0.141"
uvicorn = "^0.24"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"
pytest-cov = "^4.1"
flake8 = "^6.1"
black = "^23.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=src"
